# =============================================================================
# AulaSempre - Profile Padrão (H2 em memória)
# Para usar MySQL: ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
# =============================================================================

# Servidor
server.port=8080

# ===== Banco de dados H2 (desenvolvimento local) =====
spring.datasource.url=jdbc:h2:mem:aulasempre;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console do H2 disponível em: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== JPA / Hibernate =====
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# ===== JWT =====
ajwt.secret=AulaSempreSecretKeyParaJWT2024MuitoSegura!@#$%
ajwt.expiration=86400000
