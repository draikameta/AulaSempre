# =============================================================================
# AulaSempre - Profile MySQL
# Ativação: ./mvnw spring-boot:run -Dspring-boot.run.profiles=mysql
# =============================================================================

# ===== Conexão MySQL =====
spring.datasource.url=jdbc:mysql://localhost:3306/aulasempre?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=

# ===== JPA / Hibernate =====
# validate = Hibernate apenas valida se as entidades batem com o schema real.
# O schema é gerenciado pelo script aulasempre.sql, nunca pelo Hibernate.
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== H2 desativado neste profile =====
spring.h2.console.enabled=false
